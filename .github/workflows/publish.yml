name: Publish

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            mill-targets: mill.scalalib.scalafmt/checkFormatAll + flagged.jvm.test + flagged.jvm.checkCompatibility + examples.compile + bench.compile
            node-version: ''
            install-native-deps: false
          - platform: js
            mill-targets: flagged.js.test + flagged.js.checkCompatibility + flagged.jsWasm.compile + bench-portable.js.compile
            node-version: '22'
            install-native-deps: false
          - platform: native
            mill-targets: flagged.native.test + flagged.native.checkCompatibility + bench-portable.native.compile
            node-version: ''
            install-native-deps: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        if: ${{ matrix.node-version != '' }}
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Scala Native toolchain
        if: ${{ matrix.install-native-deps }}
        run: sudo apt-get update && sudo apt-get install -y clang libgc-dev libunwind-dev
      - name: Run tests
        run: ./mill --no-server ${{ matrix.mill-targets }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Publish to Maven Central
        run: ./mill --no-server mill.javalib.SonatypeCentralPublishModule/
        env:
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
