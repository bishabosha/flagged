version = "3.11.5"
runner.dialect = scala3future
align.preset = more
maxColumn = 100
# verticalMultiline.atDefnSite = true
newlines.usingParamListModifierPrefer = before
# bin-pack all-literal argument lists, including string literals (excluded by default),
# e.g. the benchmark command lines
binPack.literalArgumentLists = true
binPack.literalsExclude = ["Term.Name"]

# BEGIN capture-checked-only settings (stripped by `mill deriveStable` on derived branches)
# scala3future parses the capture annotations (`^`, `^{...}`) and pure arrows (`->`), but not
# the `update`/`consume` soft modifiers — so only the files bearing those modifiers are excluded;
# format them by hand. The generated unchecked variants under out/ are derived artifacts and are
# excluded as a whole.
project.excludePaths = [
  "glob:**/out/**",
  "glob:**/flagged/src/flagged/Parser.scala",
  "glob:**/flagged/src/flagged/internal/Engine.scala",
  "glob:**/flagged/src/flagged/internal/Assemble.scala",
]
# END capture-checked-only settings
