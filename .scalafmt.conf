version = "3.11.5"
runner.dialect = scala3future
align.preset = more
maxColumn = 100
# verticalMultiline.atDefnSite = true
newlines.usingParamListModifierPrefer = before
# bin-pack all-literal argument lists, including string literals (excluded by default),
# e.g. the benchmark command lines
binPack.literalArgumentLists = true
binPack.literalsExclude = ["Term.Name"]

# build outputs (including sources generated by other branches' builds) are not format-checked
project.excludePaths = ["glob:**/out/**"]
